<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 520" fill="none" role="img">
  <title>Porta portal sphere with multichain brand ring (Coming — not a live availability list)</title>
  <defs>
    <linearGradient id="ring" x1="70" y1="70" x2="450" y2="450" gradientUnits="userSpaceOnUse">
      <stop stop-color="#00EAFF"/>
      <stop offset="0.5" stop-color="#6A7BFF"/>
      <stop offset="1" stop-color="#BC29FF"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#00EAFF" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#BC29FF" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.2"/>
    </filter>
  </defs>
  <circle cx="260" cy="260" r="230" fill="url(#glow)"/>
  <circle cx="260" cy="260" r="188" stroke="url(#ring)" stroke-width="1.25" stroke-dasharray="3 9" opacity="0.85"/>
  <circle cx="260" cy="260" r="154" stroke="url(#ring)" stroke-width="0.6" opacity="0.28"/>
