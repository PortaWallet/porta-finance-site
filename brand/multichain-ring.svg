="middle" fill="#F3F6FB" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="8.5" font-weight="600">FTM</text>    <title>Fantom</title>  </g>  <g>    <circle cx="166.0" cy="422.8" r="22" fill="#0A0B1E" stroke="url(#ring)" stroke-width="1.4"/>    <text x="166.0" y="426.4" text-anchor="middle" fill="#F3F6FB" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="8.5" font-weight="600">zkS</text>    <title>zkSync</title>  </g>  <g>    <circle cx="97.2" cy="354.0" r="22" fill="#0A0B1E" stroke="url(#ring)" stroke-width="1.4"/>    <text x="97.2" y="357.6" text-anchor="middle" fill="#F3F6FB" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="8.5" font-weight="600">LINEA</text>    <title>Linea</title>  </g>  <g>    <circle cx="72.0" cy="260.0" r="22" fill="#0A0B1E" stroke="url(#ring)" stroke-width="1.4"/>    <text x="72.0" y="263.6" text-anchor="middle" fill="#F3F6FB" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="8.5" font-weight="600">BASE</text>    <title>Base</title>  </g>  <g>    <circle cx="97.2" cy="166.0" r="22" fill="#0A0B1E" stroke="url(#ring)" stroke-width="1.4"/>    <text x="97.2" y="169.6" text-anchor="middle" fill="#F3F6FB" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="8.5" font-weight="600">MNT</text>    <title>Mantle</title>  </g>  <g>    <circle cx="166.0" cy="97.2" r="22" fill="#0A0B1E" stroke="url(#ring)" stroke-width="1.4"/>    <text x="166.0" y="100.8" text-anchor="middle" fill="#F3F6FB" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="8.5" font-weight="600">SCRL</text>    <title>Scroll</title>  </g></svg>
